name: Build EchoMusic APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'EchoMusic_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Extract Android project
        run: unzip -q EchoMusic_Android_Project.zip

      - name: Build debug APK
        run: gradle -p EchoMusic assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EchoMusic-debug-APK
          path: EchoMusic/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
